<script>
const $=id=>document.getElementById(id),A='#FFB000',G='#00FF66',R='#D32F2F',T='#2C9C9C',P='#4A5568';

let seq=0;
function spawn(t){const s=Math.random()*4|0,k=rnd(-.8,.8),e=1.12;
 const p=[[k,-e],[e,k],[k,e],[-e,k]][s];t.x=p[0];t.z=p[1];
 t.hdg=Math.atan2(-p[0],p[1])+Math.PI+rnd(-.5,.5)-Math.PI;t.hdg=Math.atan2(-p[0],p[1]);t.hdg=Math.atan2(-p[0]+rnd(-.4,.4),p[1]*-1+rnd(-.4,.4));

function mk(){const r=Math.random(),unk=r<.2,t={id:seq++,unk};
 t.op=unk?'---':pick(OPS);t.cs=unk?'UNK'+(100+t.id):t.op+(100+Math.random()*890|0);t.ty=unk?'????':pick(TY);

 t.gs=rnd(390,510)|0;t.alt=(rnd(300,400)|0)*100;t.sq=unk?'7777':(Math.random()*7e3+1e3|0)+'';

TK.forEach(t=>{const e=Math.random()*4|0});

function pr(x,y,z){const c=Math.cos(yaw),s=Math.sin(yaw),x1=x*c+z*s,z1=-x*s+z*c,cp=Math.cos(pit),sp=Math.sin(pit),y2=y*cp-z1*sp,z2=y*sp+z1*cp,D=3.2,k=D/(D-z2)*zoom,sc=Math.min(W,H)*.42;return[W/2+x1*k*sc,H/2*1.02-y2*k*sc,k]}
const AY=a=>a/45000*.5;
function line(a,b){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
function draw(dt){ctx.clearRect(0,0,W,H);ctx.lineWidth=1;
 ctx.strokeStyle='#0E1C22';for(let i=-5;i<=5;i++){const v=i*.2;line(pr(v,0,-1),pr(v,0,1));line(pr(-1,0,v),pr(1,0,v))}
 ctx.strokeStyle='#1F3A44';const bx=[[-1,-1],[1,-1],[1,1],[-1,1]];for(let i=0;i<4;i++)line(pr(bx[i][0],0,bx[i][1]),pr(bx[(i+1)%4][0],0,bx[(i+1)%4][1]));
 // FIR volume
 ctx.strokeStyle='rgba(255,176,0,.55)';ctx.setLineDash([]);
 for(const y of[0,AY(45000)]){ctx.beginPath();FIR.forEach((p,i)=>{const q=pr(p[0],y,p[1]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath();ctx.stroke()}
 ctx.strokeStyle='rgba(255,176,0,.22)';ctx.setLineDash([2,4]);FIR.forEach(p=>line(pr(p[0],0,p[1]),pr(p[0],AY(45000),p[1])));
 ctx.strokeStyle='rgba(255,176,0,.10)';const mid=AY(24500);ctx.beginPath();FIR.forEach((p,i)=>{const q=pr(p[0],mid,p[1]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath();ctx.stroke();ctx.setLineDash([]);
 // stations
 ST.forEach(s=>{const q=pr(s.x,0,s.z),r=7*q[2];ctx.strokeStyle=T;ctx.strokeRect(q[0]-r/2,q[1]-r/2,r,r);
  ctx.beginPath();ctx.arc(q[0],q[1],r*2.2,0,7);ctx.strokeStyle='rgba(44,156,156,.25)';ctx.setLineDash([1,3]);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=T;ctx.font='8px Roboto Mono,monospace';ctx.fillText(s.n,q[0]+r,q[1]+3)});
 // tracks
 for(const t of TK){const st=status(t),col=COL[st],y=AY(t.alt),q=pr(t.x,y,t.z),g=pr(t.x,0,t.z);t.sx=q[0];t.sy=q[1];
  let ns=ST[0],bd=9;ST.forEach(s=>{const d=Math.hypot(s.x-t.x,s.z-t.z);if(d<bd){bd=d;ns=s}});
  const isS=t.id===sel;
  ctx.setLineDash([2,4]);ctx.strokeStyle=isS?col:'rgba(74,85,104,.5)';line(q,g);
  const sp=pr(ns.x,0,ns.z);ctx.strokeStyle=isS?col:(st==='U'?'rgba(211,47,47,.35)':'rgba(44,156,156,.28)');line(q,sp);ctx.setLineDash([]);
  if(t.trail.length>1){ctx.strokeStyle=col;ctx.globalAlpha=.5;ctx.beginPath();t.trail.forEach((p,i)=>{const a=pr(p[0],AY(t.alt),p[1]);i?ctx.lineTo(a[0],a[1]):ctx.moveTo(a[0],a[1])});ctx.lineTo(q[0],q[1]);ctx.stroke();ctx.globalAlpha=1}
  ctx.fillStyle=col;ctx.strokeStyle=col;const r=4.5*q[2];
  ctx.beginPath();ctx.moveTo(q[0],q[1]-r);ctx.lineTo(q[0]+r,q[1]);ctx.lineTo(q[0],q[1]+r);ctx.lineTo(q[0]-r,q[1]);ctx.closePath();
  st==='U'?ctx.fill():ctx.stroke();
  if(st==='U'){const b=r*2.2,k=b*.45;[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,c])=>{ctx.beginPath();ctx.moveTo(q[0]+a*b,q[1]+c*(b-k));ctx.lineTo(q[0]+a*b,q[1]+c*b);ctx.lineTo(q[0]+a*(b-k),q[1]+c*b);ctx.stroke()})}
  ctx.font='9px Roboto Mono,monospace';ctx.fillStyle=col;ctx.fillText(t.cs,q[0]+r+5,q[1]-2);ctx.fillStyle=P;ctx.fillText('FL'+t.alt/100+' '+t.gs,q[0]+r+5,q[1]+8);
  if(isS){const b=16*q[2];ctx.strokeStyle=col;ctx.lineWidth=1;ctx.setLineDash([]);
   [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,c])=>{ctx.beginPath();ctx.moveTo(q[0]+a*b,q[1]+c*(b-6));ctx.lineTo(q[0]+a*b,q[1]+c*b);ctx.lineTo(q[0]+a*(b-6),q[1]+c*b);ctx.stroke()});
   ctx.beginPath();[[-1,0],[1,0],[0,-1],[0,1]].forEach(([a,c])=>{ctx.moveTo(q[0]+a*(b+3),q[1]+c*(b+3));ctx.lineTo(q[0]+a*(b+11),q[1]+c*(b+11))});ctx.stroke();
   const sq=pr(t.x+Math.sin(t.hdg)*.12,y,t.z-Math.cos(t.hdg)*.12);line(q,sq)}
 }
 $('tl').innerHTML='AZ '+((yaw*57.3%360+360)%360|0)+'&deg; EL '+(pit*57.3|0)+'&deg; ZM '+zoom.toFixed(2)+'x<br>GRID 0.2 // FL000&ndash;450';
 $('br').innerHTML='SIM DATA // NOT FOR NAVIGATION<br>DRAG ROTATE // WHEEL ZOOM // CLICK SELECT';
}
const LOGS=[];function log(c,m,k){const d=new Date(),ts=d.toISOString().slice(11,19),el=document.createElement('div');el.className='l-'+(k||'d');el.textContent='['+ts+'] '+c+' // '+m;const lg=$('lg');lg.appendChild(el);while(lg.children.length>40)lg.firstChild.remove()}
const fx=(v,n)=>v.toFixed(n),pad=(v,n)=>String(v).padStart(n,'0');
function ll(t){const la=2-(t.z)*8,lo=46+t.x*8;return[Math.abs(la).toFixed(3)+(la>=0?'N':'S'),lo.toFixed(3)+'E']}
let rev=0,rec=0,lk=0;
function tick(dt){for(const t of TK){const v=t.gs/450*.03;t.x+=Math.sin(t.hdg)*v*dt;t.z-=Math.cos(t.hdg)*v*dt;
  t._c=(t._c||0)+dt;if(t._c>.6){t._c=0;t.trail.push([t.x,t.z]);if(t.trail.length>18)t.trail.shift()}
  const n=inFIR(t.x,t.z);
  if(n!==t.in){t.in=n;t.trail=[];log(n?'FIR_ENTRY':'FIR_EXIT',t.cs+' FL'+t.alt/100+(n&&t.unk?' NO_FPL':''),n&&t.unk?'r':n?'a':'d');
   if(n)log(t.unk?'REG_LOOKUP_FAIL':'FPL_MATCH',t.unk?'sq '+t.sq+' unresolved':t.reg+' '+t.op,t.unk?'r':'g')}
  if(n){const f=t.gs/450*4.2*dt;rev+=f;t.unk||t.pend?0:0;t.unk?lk+=f:rec+=f}
  if(Math.abs(t.x)>1.2||Math.abs(t.z)>1.2){const nt=mk();nt.id=t.id;Object.assign(t,nt);aim(t);t.in=false}}
}
function ui(){const L=[...TK].sort((a,b)=>'UPME'.indexOf(status(a))-'UPME'.indexOf(status(b)));
 $('tb').innerHTML=L.map(t=>{const s=status(t);return`<tr class="tk${t.id===sel?' sel':''}" data-i="${t.id}"><td class="c-${s}">${t.cs}</td><td>${t.alt/100}</td><td>${t.gs}</td><td class="c-${s}">${SN[s]}</td></tr>`}).join('');
 $('tc').textContent=TK.filter(t=>t.in).length+'/'+TK.length;
 $('hu').textContent='UNK '+TK.filter(t=>t.unk&&t.in).length;
 const t=TK.find(x=>x.id===sel)||TK[0],s=status(t),p=ll(t);$('sid').textContent=t.cs;
 const kv=[['STATUS','<span style="color:'+COL[s]+'">'+SN[s]+'</span>'],['TYPE',t.ty],['OPER',t.op],['REG',t.reg],['ALT','FL'+t.alt/100],['GS',t.gs+' kt'],['HDG',pad(Math.round((t.hdg*57.3+360)%360),3)+'&deg;'],['SQK',t.sq],['LAT',p[0]],['LON',p[1]],['FPL',t.unk?'NONE':'FILED'],['INV',t.unk?'BLOCKED':t.pend?'QUEUED':'ISSUED']];
 $('kv').innerHTML=kv.map(a=>`<div><span>${a[0]}</span><b>${a[1]}</b></div>`).join('');
 $('rv').textContent=fx(rev,0).replace(/\B(?=(\d{3})+$)/g,',');$('rc').textContent=fx(rec,0);$('lk').textContent=fx(lk,0);

 const n=TK.filter(x=>x.in),m=n.length||1,pf=n.filter(x=>!x.unk).length/m*100,pr2=pf,pi=n.filter(x=>!x.unk&&!x.pend).length/m*100;
 $('rec').innerHTML=[['ADS-B/MLAT TRACKED',100,A],['FLIGHT PLAN MATCHED',pf,G],['OWNER REGISTRY RESOLVED',pr2,G],['INVOICE ISSUED',pi,A]].map(a=>`<div class="row"><div class="t"><span>${a[0]}</span><b>${a[1].toFixed(0)}%</b></div><div class="bar"><i style="width:${a[1]}%;background:${a[2]}"></i></div></div>`).join('');
 ST.forEach(s=>{s.rx+=Math.random()*9|0;s.snr=Math.max(24,Math.min(40,s.snr+rnd(-.4,.4)));s.lat=Math.max(6,Math.min(40,s.lat+rnd(-1,1)));s.bat=Math.max(20,s.bat-.004)});
 $('st').innerHTML=ST.map(s=>`<div class="row"><div class="t"><b style="color:${T}">${s.n}</b><span>${s.rx} msg/s</span></div><div class="t"><span>SNR ${s.snr.toFixed(1)}dB</span><span>LAT ${s.lat.toFixed(0)}ms</span><span>BAT ${s.bat.toFixed(0)}%</span></div><div class="bar"><i style="width:${s.bat}%;background:${T}"></i></div></div>`).join('');
 $('clk').textContent=new Date().toISOString().slice(11,19)+'Z'}
$('tb').onclick=e=>{const r=e.target.closest('tr');if(r){sel=+r.dataset.i;ui()}};
const PT=new Map();let pd=0;
cv.onpointerdown=e=>{PT.set(e.pointerId,[e.clientX,e.clientY]);drag=[e.clientX,e.clientY];moved=0;pd=0;cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!PT.has(e.pointerId))return;PT.set(e.pointerId,[e.clientX,e.clientY]);

 if(!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];moved+=Math.abs(dx)+Math.abs(dy);yaw+=dx*.006;pit=Math.max(.15,Math.min(1.45,pit+dy*.005));drag=[e.clientX,e.clientY]};
